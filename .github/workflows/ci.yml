name: Relay CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: www/package-lock.json
      - name: Build console
        working-directory: www
        run: npm ci && npm run build
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache-dependency-path: go.sum
      - name: Test Go relay
        run: go test ./...
      - name: Vet Go relay
        run: go vet ./...
